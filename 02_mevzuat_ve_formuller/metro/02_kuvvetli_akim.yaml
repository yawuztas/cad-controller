# -*- coding: utf-8 -*-
# İBB RAYLI SİSTEMLER KUVVETLİ AKIM STANDARTLARI
# Mevzuat & Standartlar: İBB Raylı Sistemler AG Dağıtım Şartnamesi
#                        TS HD 60364-5-52:2014, NFPA 130:2020, EN 50174-2

discipline: "KUVVETLI_AKIM"
scope: "METRO_VE_RAYLI_SISTEMLER"
version: "2026.1"

voltage_drop_limits:
  lighting_max_pct: 3.0                       # Metro istasyon tavan aydınlatma linyesi
  socket_power_max_pct: 5.0                   # Metro tali priz ve mekanik güç linyesi
  main_column_max_pct: 2.0                    # Trafo/Jeneratör ile ana pano (AG Dağıtım) arası
  total_allowed_pct: 5.0                      # Toplam izin verilen gerilim düşümü azami %5.0

phase_imbalance_limits:
  spec_strict_pct: 10.0                       # İkitelli-Ataköy / katı metro şartnamesi sınırı (%10)
  warning_pct: 15.0                           # Pano faz dengesizliği uyarı sınırı
  critical_pct: 20.0                          # Pano faz dengesizliği kritik sınırı (Metro için sıkı eşik)
  target_after_optimization_pct: 5.0          # LPT optimizasyon hedefi < %5

transformer_and_ups:
  traction_nominal_vdc: 1500.0                # EN 50163: min 1000V, nom 1500V, max cont 1800V DC
  traction_min_vdc: 1000.0
  traction_max_vdc: 1800.0
  auxiliary_primary_kv: 34.5
  auxiliary_secondary_kv: 0.4
  n1_transformer_redundancy: true             # Tek trafo devre dışıyken (N-1) kalan trafo tüm istasyon talebini taşır
  switchboard_form: "Form-4b"
  ups_min_autonomy_min: 120                   # Asgari akü otonomi süresi (120 dk)
  motor_start_max_vd_pct: 15.0                # Acil/jeneratör modunda motor demarajında max %15 gerilim düşümü

circuit_limits:
  max_fixtures_per_circuit: 16                # İstasyon platformu armatür sınırı
  default_socket_power_w: 300.0
  default_luminaire_power_w: 31.0             # Tipik LED armatür gücü

cable_physics:
  copper_conductivity: 56.0
  default_installation_method: "E"            # Delikli kablo tavasında çok damarlı kablo
  default_ambient_temp_c: 30
  default_grouped_circuits: 3                 # Çizelge B.52.17: 3 devre tava gruplama katsayısı (0.70)
  derating_factor: 0.70

