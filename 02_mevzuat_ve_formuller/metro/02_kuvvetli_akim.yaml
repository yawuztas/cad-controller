protection_coordination:
  check_ib_in_iz: true
  check_rcd_mcb_capacity: true

tray_fill_limit_pct: 40.0                     # İBB Şartnamesi: Kablo tavası doluluk oranı en fazla %40 (bazı hatlarda %60)
tray_fill_max_spec_pct: 60.0                  # Bazı metro şartnamelerinde %40 rezerv şartıyla azami %60 doluluk
tray_separation_rules_cm:
  ag_to_weak_current_min_cm: 30.0
  og_to_ag_min_cm: 50.0

fire_and_life_safety:
  lszh_mandatory: true                        # Halogen-Free (Düşük duman sıfır halojen) tüm kablolarda zorunlu
  fe180_emergency_panels: ["İAP-E", "IAPE", "CDB", "MCC_E", "UPS"]
  fire_pump_safety:
    fe180_required: true
    prohibit_30ma_rcd: true
    independent_feeder: true
