protection_coordination:
  check_ib_in_iz: true
  check_rcd_mcb_capacity: true

fire_and_life_safety:
  lszh_mandatory: true
  fe180_emergency_panels: ["İAP-E", "IAPE", "CDB", "MCC_E", "UPS"]
  fe180_weak_current_systems: ["AX-02", "TL-05"]

weak_current:
  max_cat6_length_m: 90.0
  max_fire_loop_addresses: 128
  # ALT SİSTEM HARİTASI: M09 hattı paftalarının DXF içerik analiziyle (TL-03=
  # TELEFON, TL-06=CCTV/KAMERA, TL-10=PIS baskınlığı) doğrulanmış hat gerçek
  # kodlamasıdır. TL-01 bu hatta kullanılmaz (yalnız 2 adet tipik PRT paftası).
  subsystems:
    AX-02: "Yangın Algılama ve İhbar Sistemi (FACP / Loop)"
    TL-02: "Veri İletişim, LAN & Fiber Optik Altyapı (SDH/OTN Omurga)"
    TL-03: "Telefon, Acil SOS & Dahili Haberleşme Sistemi (PABX/Interkom)"
    TL-04: "Telsiz / TETRA Haberleşme & Anten Sistemi"
    TL-05: "Acil Anons ve Sesli Tahliye Sistemi (PA/VA)"
    TL-06: "Kapalı Devre Televizyon / CCTV Kamera Sistemi"
    TL-07: "Saat Sistemi (Master Clock & Tali Saatler)"
    TL-08: "Geçiş Kontrol ve Güvenlik Sistemi (ACS)"
    TL-09: "SCADA, PLC, Otomasyon & Yangın Senaryo Sistemi"
    TL-10: "Yolcu Bilgilendirme Sistemi (PIS)"
    TL-11: "Sistem Odası (SER/CER) Rack Kabinet Yerleşim Planı"

tray_fill_limit_pct: 40.0
