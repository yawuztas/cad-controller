# -*- coding: utf-8 -*-
# Türkiye Elektrik İç Tesisleri ve Yangın Yönetmeliği Kural Paketi
# Resmi Standartlar: EİTY (RG:18565), BYKHY (2007/12937), TS HD 60364-4-43:2012, TS HD 60364-5-52:2014, TS HD 60364-5-54:2013

name: "TÜRKİYE BİNA VE TESİS ELEKTRİK YÖNETMELİĞİ"
code: "TR_BUILDING_CODE"
version: "2026.2"

standard_references:
  interior: "Elektrik İç Tesisleri Yönetmeliği (RG: 04.11.1984/18565 - Md. 52, Md. 57)"
  voltage_drop: "Elektrik İç Tesisleri Yönetmeliği (RG: 18565 - Md. 57/a-2) & TS HD 60364-5-52:2014 Çizelge G.52.1"
  ampacity: "TS HD 60364-5-52:2014 Madde 523 (Çizelge B.52.2 - B.52.5, B.52.14, B.52.17)"
  fire_safety: "Binaların Yangından Korunması Hakkında Yönetmelik (BYKHY 2007/12937 - Md. 72, Md. 83)"
  grounding: "Elektrik Tesislerinde Topraklamalar Yönetmeliği (RG: 21.08.2001/24500 - Md. 10 & Ek-P)"
  overcurrent: "TS HD 60364-4-43:2012 Madde 433.1 (Aşırı Yük Koruması: Ib <= In <= Iz)"
  earthing_conductors: "TS HD 60364-5-54:2013 Madde 543.1.2 / Çizelge 54.2 (PE Koruma İletkeni Kesitleri)"

voltage_drop_limits:
  lighting_max_pct: 1.5
  socket_power_max_pct: 3.0
  main_column_max_pct: 1.5
  total_allowed_pct: 3.0

phase_imbalance_limits:
  warning_pct: 15.0
  critical_pct: 25.0

circuit_limits:
  max_lighting_points: 9
  max_socket_points_1ph: 7
  default_socket_power_w: 250.0        # EİTY Md. 57: 1 fazlı priz linyesinde priz başına min. 250-300W
  default_luminaire_power_w: 36.0

cable_physics:
  copper_conductivity: 56.0
  default_installation_method: "C"     # Yöntem C: Sıva altı / duvar yüzeyi / kablo kanalı
  default_ambient_temp_c: 30
  default_grouped_circuits: 2          # Çizelge B.52.17: 2 devre gruplama katsayısı (0.80) veya genel 0.85
  derating_factor: 0.85

