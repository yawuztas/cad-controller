# -*- coding: utf-8 -*-
# İBB RAYLI SİSTEMLER ZAYIF AKIM VE İLETİŞİM STANDARTLARI
# Mevzuat & Standartlar: NFPA 130, EN 54, ISO/IEC 11801, EN 50121, EN 50125

discipline: "ZAYIF_AKIM"
scope: "METRO_VE_RAYLI_SISTEMLER"
version: "2026.1"

general_rules:
  max_cat6_length_m: 90.0                     # Kabinet ile uç birim arası maks 90 metre
  mandatory_cable_rating: "LSZH (Low Smoke Zero Halogen) ve Yangın hatlarında FE180 / PH120"
  fas_smoke_max_area_m2: 80.0                 # EN 54-14: Genel/peron optik duman max 80 m², r=7.5m
  fas_smoke_max_radius_m: 7.5
  fas_tech_room_max_area_m2: 30.0             # Trafo/OG odaları max 30 m², r=5.3m
  fas_tech_room_max_radius_m: 5.3
  fas_double_ceiling_gap_cm: 80.0             # Asma tavan boşluğu > 80cm ise çift kat detektör zorunlu
  cctv_dori_identification_px_per_m: 250.0    # EN 62676-4 Turnike/bilet alanında tanıma >= 250 px/m
  cctv_dori_observation_px_per_m: 125.0       # Peron/yürüyen merdiven >= 125 px/m
  cctv_min_retention_days: 30                 # 7/24 kesintisiz en az 30 gün NVR/SAN kayıt
  pava_min_spl_dba: 85.0
  pava_min_sti: 0.50
  pava_ab_interleaved_required: true          # Ardışık hoparlörler A/B farklı hatlardan beslenmeli
  scada_dual_fiber_ring_required: true        # Çift fiber optik halka zorunlu
  scada_io_match_required: true

subsystems:
  AX-02:
    name: "Yangın Algılama ve İhbar Sistemi (FACP / Loop)"
    standard: "EN 54-2, EN 54-14, NFPA 130"
    max_loop_addresses: 128
    cable: "JH(St)H FE180 / PH120"
  TL-02:
    name: "Veri İletişim, LAN & Fiber Optik Altyapı (SDH/OTN Omurga)"
    standard: "ISO/IEC 11801, ITU-T G.652D"
    backbone: "Tek Modlu (OS2) 48/96 Core Zırhlı Fiber Optik"
  TL-03:
    name: "Telefon, Acil SOS & Dahili Haberleşme Sistemi (PABX/Interkom)"
    features: "Tünel ve peron SOS acil çağrı butonları, ray boyu telefon hatları"
  TL-04:
    name: "Telsiz / TETRA Haberleşme & Anten Sistemi"
    cables: "1/2 inç ve 7/8 inç Sızdırmalı (Leaky Feeder) Koaksiyel Kablo"
  TL-05:
    name: "Acil Anons ve Sesli Tahliye Sistemi (PA/VA)"
    standard: "EN 54-16, NFPA 130 (STI anlaşılabilirlik skoru >= 0.50)"
  TL-06:
    name: "Kapalı Devre Televizyon / CCTV Kamera Sistemi"
    features: "Peron kenarı, yürüyen merdiven ve turnike izleme kameraları"
  TL-07:
    name: "Merkezi Saat Sistemi (Master Clock & Tali Saatler)"
    synchronization: "GPS / NTP Zaman Senkronizasyonu"
  TL-08:
    name: "Geçiş Kontrol ve Güvenlik Sistemi (ACS)"
    features: "Turnikeler, kilitli teknik kapılar, manyetik kilitler"
  TL-09:
    name: "SCADA, PLC, İstasyon Otomasyonu & Yangın Senaryosu"
    protocol: "IEC 60870-5-104 / Modbus TCP"
  TL-10:
    name: "Yolcu Bilgilendirme Sistemi (PIS / Monitörler)"
    display: "Peron ve bilet holü LED/LCD tren varış panoları"
  TL-11:
    name: "Sistem Odası (SER/CER) Rack Kabinet Yerleşim Planı"
    rules: "42U 800x1000 Server Rack, sıcak/soğuk koridor düzeni, yükseltilmiş taban"
