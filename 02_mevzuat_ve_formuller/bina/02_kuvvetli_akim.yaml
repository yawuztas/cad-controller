# ==============================================================================
# TÜRKİYE BİNA VE TESİSLERİ KUVVETLİ AKIM STANDARTLARI (FULL SÜRÜM)
# ==============================================================================
# Yasal Mevzuat:
#   - Elektrik İç Tesisleri Yönetmeliği (EİTY - RG: 04.11.1984/18565, Md. 57, Md. 62)
#   - Binaların Yangından Korunması Hakkında Yönetmelik (BYKHY - 2007/12937, Md. 67-84)
#   - EPDK Reaktif Güç Kontrol Yönetmeliği / Elektrik Piyasası Bağlantı Yönetmeliği
#   - TEDAŞ / BEDAŞ Bina Bağlantı ve Eşzamanlılık Esasları
# Ulusal / Uluslararası Standartlar:
#   - TS HD 60364-5-52:2014 (Kablo Seçimi, Akım Taşıma Kapasitesi ve Gerilim Düşümü)
#   - TS HD 60364-4-43:2012 (Aşırı Akıma ve Kısa Devreye Karşı Koruma)
#   - TS EN 60909-0 (Üç Fazlı AC Sistemlerde Kısa Devre Akımlarının Hesaplanması)
#   - TS EN 12464-1:2021 (Kapalı Çalışma Alanları Aydınlatma Standardı)

discipline: "KUVVETLI_AKIM"
scope: "BİNA_İÇ_VE_DIŞ_TESİSLERİ"
version: "2026.2-FULL"

# ------------------------------------------------------------------------------
# 1. GERİLİM DÜŞÜMÜ SINIRLARI VE ANALİTİK FORMÜLLERİ (EİTY MD. 57 & TS HD 60364-5-52)
# ------------------------------------------------------------------------------
voltage_drop_limits:
  lighting_max_pct: 1.5                       # EİTY Md. 57: Yapı bağlantı kutusu -> son aydınlatma armatürü maks %1.5
  socket_power_max_pct: 3.0                   # EİTY Md. 57: Yapı bağlantı kutusu -> son priz / motor maks %3.0
  main_column_max_pct: 1.5                    # Kofre / Trafo -> Ana Pano (kolon hattı) tavsiye edilen maks %1.5 (EİTY üst sınır %3.5)
  ups_sensitive_max_pct: 2.0                  # UPS ve hassas elektronik besleme hatları maks %2.0
  total_allowed_public_grid_pct: 3.0          # Alçak gerilim şebekesinden beslenen binalarda toplam maks %3.0
  total_allowed_private_trafo_pct: 5.0        # Özel trafolu binalarda aydınlatma %6.5 / kuvvet %8.0 (IEC 60364 Ek G: %5.0/%8.0)
  motor_starting_max_pct: 15.0                # Motor kalkış (demeraj) anında izin verilen maks gerilim düşümü %15.0

voltage_drop_formulas:
  # 1.1 Yöntem A: Klasik Omik Gerilim Düşümü Formülü (EİTY Md. 57 — S <= 16 mm² için yeterli)
  ohmic_eity_formula:
    single_phase_230v: "%e = (200 * L * P) / (kappa * S * U_n^2)   [P: Watt, U_n: 230 V, L: metre, S: mm²]"
    three_phase_400v:  "%e = (100 * L * P) / (kappa * S * U_n^2)   [P: Watt, U_n: 400 V, L: metre, S: mm²]"
    current_based_1ph: "%e = (200 * L * I_b * cos_phi) / (kappa * S * U_n)"
    current_based_3ph: "%e = (100 * sqrt(3) * L * I_b * cos_phi) / (kappa * S * U_n)"

  # 1.2 Yöntem B: Tam Empedanslı (Reaktans Dahil) Gerilim Düşümü Formülü (TS HD 60364-5-52 Ek-G)
  exact_impedance_iec_formula:
    voltage_drop_volts: "Delta_U = b * I_b * (L / 1000) * (R_km * cos_phi + X_km * sin_phi) / n_paralel"
    voltage_drop_pct: "%e = (Delta_U / U_n) * 100"
    b_circuit_factor:
      single_phase_230v: 2.0                  # 1 Faz (Faz + Nötr gidiş-dönüş): b = 2
      three_phase_400v: 1.7320508             # 3 Faz dengeli sistem: b = sqrt(3)

# ------------------------------------------------------------------------------
# 2. LİNYE, SORTİ VE FAZ DENGESİ KURALLARI (EİTY MD. 57 - 63)
# ------------------------------------------------------------------------------
circuit_limits:
  max_lighting_points: 9                      # EİTY: 1 aydınlatma linyesine en fazla 9 sorti bağlanabilir
  max_socket_points_1ph: 7                    # EİTY: 1 fazlı priz linyesine en fazla 7 priz sortisi bağlanabilir
  default_socket_power_w: 300.0               # EİTY konut/ofis priz sortisi hesap gücü min 250-300 W (Uygulamada 300W)
  heavy_appliance_socket_power_w: 2500.0      # Çamaşır, bulaşık, fırın, ütü, klima müstakil priz linyesi (min 2000-2500W)
  default_luminaire_power_w: 36.0             # Tipik aydınlatma sorti gücü
  min_lighting_wire_mm2: 1.5                  # Aydınlatma linyesi en küçük bakır kesiti 1.5 mm²
  min_socket_wire_mm2: 2.5                    # Priz linyesi en küçük bakır kesiti 2.5 mm²
  max_lighting_mcb_a: 10.0                    # 1.5 mm² aydınlatma linyesi koruma sigortası 10A (veya max 16A)
  max_socket_mcb_a: 16.0                      # 2.5 mm² priz linyesi koruma sigortası 16A

phase_imbalance_limits:
  warning_pct: 15.0                           # Fazlar arası yük dengesizliği uyarı eşiği (%15)
  critical_pct: 25.0                          # Fazlar arası yük dengesizliği kritik hata eşiği (%25)
  target_after_optimization_pct: 5.0          # LPT optimizasyonu sonrası hedeflenen faz dengesi (< %5)
  neutral_current_formula: "I_N = sqrt(I_R^2 + I_S^2 + I_T^2 - (I_R*I_S + I_S*I_T + I_T*I_R))"

# ------------------------------------------------------------------------------
# 3. TALEP GÜCÜ VE EŞZAMANLILIK (DİVERSİTE) KATSAYILARI (EİTY MD. 57 & TEDAŞ)
# ------------------------------------------------------------------------------
demand_and_diversity_rules:
  # 3.1 Tekil Konut / Daire Talep Gücü Kuralı (EİTY Md. 57 / BEDAŞ)
  dwelling_8kw_rule:
    description: "Daire kurulu gücünün ilk 8.000 W'lık kısmının %60'ı, 8.000 W'ı aşan kısmının %40'ı alınır."
    formula_le_8kw: "P_talep = P_kurulu * 0.60"
    formula_gt_8kw: "P_talep = (8000 * 0.60) + ((P_kurulu - 8000) * 0.40) = 4800 + 0.40 * (P_kurulu - 8000)"
    first_tier_limit_w: 8000.0
    first_tier_factor: 0.60
    second_tier_factor: 0.40

  # 3.2 Bina Geneli Çoklu Daire Eşzamanlılık Katsayısı (TEDAŞ / EMO Çizelgesi)
  building_apartment_coincidence_table:
