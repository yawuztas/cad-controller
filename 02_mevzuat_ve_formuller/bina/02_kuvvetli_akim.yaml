# ------------------------------------------------------------------------------
# 5. AŞIRI AKIM VE KISA DEVRE KORUMA KOORDİNASYONU (TS HD 60364-4-43 & EN 60909)
# ------------------------------------------------------------------------------
protection_coordination:
  check_ib_in_iz: true                        # Madde 433.1 Kural 1: I_b <= I_n <= I_z
  check_i2_145_iz: true                       # Madde 433.1 Kural 2: I_2 <= 1.45 * I_z (MCB'lerde I_2 = 1.45*I_n olduğu için Kural 1 sağlar)
  check_rcd_mcb_capacity: true                # KAKR anma akımı önündeki ana sigortadan küçük olamaz (I_n_RCD >= I_n_MCB)
  selectivity_rules:
    standard: "IEC 60947-2 Ek-A, TS HD 60364-5-53 Madde 536 & IEC 60898"
    amperometric_ratio_threshold: 1.60        # Tam/kısmi aşırı yük seçiciliği için I_n,üst / I_n,alt >= 1.60
    strict_hierarchy: true                    # I_n,üst > I_n,alt (Ters kademelendirme kesinlikle yasaktır)
    curve_coordination: "Üst kesici açma eğrisi alt kesiciden daha hızlı olamaz (Üst B, Alt C/D hatası)"
    rcd_selectivity:
      current_ratio_threshold: 3.0            # I_Δn,üst >= 3 * I_Δn,alt (Örn: 300mA ana, 30mA tali)
      upstream_s_type_mandatory: true         # Üst RCD mutlaka 'S' (Selektif / Gecikmeli, Δt >= 40ms) olmalıdır
  short_circuit_calculations:
    standard: "TS EN 60909-0 & TS HD 60364-4-43 Madde 434"
    three_phase_ik3_max: "I_k3 = (c_max * U_n) / (sqrt(3) * sqrt(R_top^2 + X_top^2))   [c_max = 1.05]"
    single_phase_ik1_min: "I_k1 = (c_min * U_0) / sqrt((2 * R_top)^2 + (2 * X_top)^2)   [c_min = 0.95]"
    breaking_capacity_rule: "I_cn >= I_k3_max   (Konut min 6 kA, Ticari/Ana Pano min 10-25 kA, Trafo çıkışı 36-50 kA)"
    thermal_withstand_rule: "I_k^2 * t <= k^2 * S^2   -->   S_min = (I_k * sqrt(t)) / k"

# ------------------------------------------------------------------------------
# 6. REAKTİF GÜÇ KOMPANZASYON HESABI (EPDK REAKTİF GÜÇ KONTROL MEVZUATI)
# ------------------------------------------------------------------------------
reactive_power_compensation:
  standard: "EPDK Elektrik Piyasası Bağlantı ve Sistem Kullanım Yönetmeliği"
  mandatory_installed_power_threshold_kva: 50.0 # Bağlantı gücü >= 50 kVA (veya >= 9 kW ticari) tesislerde zorunlu
  limits_below_50kva:
    max_inductive_ratio_pct: 33.0             # 9 kW - 50 kVA arası endüktif reaktif sınır <= %33 (cos_phi >= 0.95)
    max_capacitive_ratio_pct: 20.0            # Kapasitif reaktif sınır <= %20
  limits_50kva_and_above:
    max_inductive_ratio_pct: 20.0             # >= 50 kVA tesislerde endüktif sınır <= %20 (cos_phi >= 0.98)
    max_capacitive_ratio_pct: 15.0            # >= 50 kVA tesislerde kapasitif sınır <= %15 (cos_phi >= 0.99)
  capacitor_bank_formula:
    equation: "Q_c = P_aktif * (tan(arccos(cos_phi_1)) - tan(arccos(cos_phi_2)))"
    target_cos_phi_2: 0.98                    # Hedef güç katsayısı cos_phi_2 = 0.98 (tan_phi_2 = 0.203)

# ------------------------------------------------------------------------------
# 7. İÇ AYDINLATMA (LÜMEN YÖNTEMİ) HESABI (TS EN 12464-1:2021)
# ------------------------------------------------------------------------------
illumination_lumen_method:
  standard: "TS EN 12464-1:2021"
  formulas:
    room_index_k: "K = (a * b) / (h_m * (a + b))   [a: en, b: boy, h_m: armatür-çalışma düzlemi yüksekliği]"
    total_luminous_flux_lm: "Phi_toplam = (E_ort * A) / (eta_u * MF)"
    required_luminaire_count: "N = ceil(Phi_toplam / Phi_armatur)"
  typical_lux_levels:
    corridor_stairs_circulation: 100          # Koridor, merdiven ve sirkülasyon alanları: 100 lx
    wc_bathroom_changing_room: 200            # Banyo, WC, soyunma odaları: 200 lx
    storage_technical_room: 200               # Teknik odalar, kazan dairesi, pano odası: 200 lx
    classroom_meeting_room: 300               # Derslik, toplantı odası: 300 lx
    general_office_cad_workstation: 500       # Ofis, çalışma masası, laboratuvar: 500 lx
    technical_drawing_precision_work: 750     # Hassas montaj ve teknik resim masası: 750 lx

# ------------------------------------------------------------------------------
# 8. YANGIN GÜVENLİĞİ VE ACİL DURUM BESLEMESİ (BYKHY MD. 67 - 84)
# ------------------------------------------------------------------------------
fire_pump_safety:
  fe180_required: true                        # BYKHY Md. 84: Yangın pompası ve duman tahliye fanları min FE180/PH120 kablo ile beslenir
  prohibit_30ma_rcd: true                     # BYKHY Md. 84: Yangın pompası ve acil fanlara 30mA/300mA açtırıcı KAKR konulamaz!
  magnetic_only_protection: true              # Yangın pompası şalteri termik korumasız (yalnız kısa devre/manyetik korumalı) olmalıdır
  independent_feeder: true                    # Ana şalterin girişinden (köprü önünden) bağımsız besleme zorunlu
  emergency_lighting_duration_min: 60         # BYKHY Md. 70: Acil aydınlatma min 60 dk (yüksek binalarda/hastanelerde 120 dk)
