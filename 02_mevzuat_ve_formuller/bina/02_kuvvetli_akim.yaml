# TÜRKİYE BİNA VE TESİSLERİ KUVVETLİ AKIM STANDARTLARI
# Mevzuat: Elektrik İç Tesisleri Yönetmeliği (RG: 18565)
#          Binaların Yangından Korunması Hakkında Yönetmelik (BYKHY 2007/12937)
# Standart: TS HD 60364-4-43:2012, TS HD 60364-5-52:2014

discipline: "KUVVETLI_AKIM"
scope: "BİNA_İÇ_VE_DIŞ_TESİSLERİ"
version: "2026.1"

voltage_drop_limits:
  lighting_max_pct: 1.5                       # EİTY Md. 57: İç aydınlatma linyesi en fazla %1.5
  socket_power_max_pct: 3.0                   # EİTY Md. 57: Priz ve kuvvet linyesi en fazla %3.0
  main_column_max_pct: 1.5                    # Ana kolon / dağıtım hattı en fazla %1.5
  total_allowed_pct: 3.0                      # Yapı bağlantı kutusundan en uzak tüketiciye toplam maks %3.0 (Özel trafoda %5.0)

circuit_limits:
  max_lighting_points: 9                      # 1 Aydınlatma linyesine en fazla 9 armatür
  max_socket_points_1ph: 7                    # 1 Fazlı priz linyesine en fazla 7 priz
  default_socket_power_w: 250.0               # Priz sortisi hesap gücü min 250-300W
  default_luminaire_power_w: 36.0             # Tipik aydınlatma sorti gücü 36W
  min_lighting_wire_mm2: 1.5                  # Aydınlatma linye min bakır iletken kesiti
  min_socket_wire_mm2: 2.5                    # Priz linye min bakır iletken kesiti

phase_imbalance_limits:
  warning_pct: 15.0                           # Faz dengesizliği uyarı eşiği (%15)
  critical_pct: 25.0                          # Faz dengesizliği kritik hata eşiği (%25)
  target_after_optimization_pct: 5.0          # LPT optimizasyonu sonrası hedeflenen denge (< %5)

cable_physics:
  copper_conductivity: 56.0                   # Bakır iletkenlik katsayısı (m / Ohm.mm2)
  aluminum_conductivity: 35.0                 # Alüminyum iletkenlik katsayısı
  default_ambient_temp_c: 30                  # Standart hesap ortam sıcaklığı (30 °C)
  default_installation_method: "C"            # Bina standardı Yöntem C: Sıva altı / kanal / duvar yüzeyi
  derating_factor: 0.85                       # Genel yan yana devre gruplama katsayısı

