# -*- coding: utf-8 -*-
# İBB Raylı Sistemler As-Built Elektrik Standartları Kural Paketi
# Kaynak Standartlar: İBB Şartnameleri, NFPA 130, EN 50122, EN 54, ISO/IEC 11801, IEC 60364-5-52

name: "İBB RAYLI SİSTEMLER AS-BUİLT ELEKTRİK ŞARTNAMESİ"
code: "IBB_METRO_CODE"
version: "2026.2"

standard_references:
  interior: "İBB Raylı Sistemler AG Dağıtım Kriterleri & TS HD 60364-5-52:2014"
  voltage_drop: "TS HD 60364-5-52:2014 Madde 525 / Çizelge G.52.1 & İBB AG Dağıtım Şartnamesi"
  ampacity: "TS HD 60364-5-52:2014 Madde 523 (Çizelge B.52.3/B.52.5 Yöntem E Delikli Tava & B.52.17 Gruplama)"
  fire_safety: "NFPA 130:2020 Md. 8.8 & BYKHY Md. 72, 83 (FE180/PH120 ve LSZH Zorunluluğu)"
  grounding: "EN 50122-1:2022 & Elektrik Tesislerinde Topraklamalar Yönetmeliği (RG: 24500)"
  overcurrent: "TS HD 60364-4-43:2012 Madde 433.1 & TS HD 60364-5-54:2013 Çizelge 54.2"
  weak_current: "ISO/IEC 11801-1:2017 (Sinıf E 90m), EN 54-2, EN 54-14:2018"
  trays: "EN 50174-2:2018, IEC 61537 & İBB Kablo Tavası Doluluk Şartnamesi (Maks. %40)"

voltage_drop_limits:
  lighting_max_pct: 3.0
  socket_power_max_pct: 5.0
  main_column_max_pct: 2.0
  total_allowed_pct: 5.0

phase_imbalance_limits:
  warning_pct: 15.0
  # NOT: İBB metro paketi, bina paketindeki (%25) daha sıkı olan kritik eşiktir.
  # Rapor metinleri bu değerlerden otomatik türetilir (RuleEngine.get_phase_limits_text).
  critical_pct: 20.0

circuit_limits:
  max_fixtures_per_circuit: 16
  default_socket_power_w: 300.0
  default_luminaire_power_w: 31.0

cable_physics:
  copper_conductivity: 56.0
  default_installation_method: "E"     # Yöntem E: Delikli kablo tavasında çok damarlı kablo
  default_ambient_temp_c: 30
  default_grouped_circuits: 3          # Çizelge B.52.17: 3 devre tava gruplama katsayısı (0.70)
  derating_factor: 0.70

